name: update bundled extension

# Checks AMO weekly for a new Wappalyzer release and opens a pull request
# with the patched extension, so updates are reviewed before they ship.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.x"
    - name: Download and patch the latest extension
      run: python .github/update.py | tee update.log
    - name: Open a pull request if it changed
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if git diff --quiet; then
          echo "Bundled extension is up to date"
          exit 0
        fi
        version=$(unzip -p wappalyzer/data/wappalyzer-extension.zip manifest.json | python -c "import json,sys; print(json.load(sys.stdin)['version'])")
        branch="update-extension-$version"
        if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
          echo "A pull request for $version already exists"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -b "$branch"
        git commit -am "Update bundled Wappalyzer extension to $version"
        git push origin "$branch"
        gh pr create --base main --head "$branch" \
          --title "Update bundled Wappalyzer extension to $version" \
          --body "Downloaded from AMO and patched by \`.github/update.py\`: $(grep '^sha256' update.log)"
